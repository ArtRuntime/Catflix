name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs on the same ref (keeps PR pushes cheap).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - uses: actions/checkout@v4

    # Step 2: Set up JDK 17 (Gradle 9.x floor; Foojay provisions the
    # toolchain JDK 25 declared in gradle/gradle-daemon-jvm.properties)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Step 4: Build both Debug and Release APKs
    # NOTE: the release APK below is signed with DEBUG keys (no signing
    # config in app/build.gradle.kts) — fine for sideload testing, NOT for
    # Play Store. For store signing, add a signingConfigs block wired to
    # secrets (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORDS) and decode it here.
    - name: Build Debug and Release APKs
      run: |
        ./gradlew assembleDebug
        ./gradlew assembleRelease

    # Step 5: Extract version name from build.gradle.kts
    - name: Get version name from build.gradle.kts
      id: get_version
      run: |
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
        echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

    # Step 6: Create GitHub Release and Upload APKs
    # Tag includes the run number so re-runs never collide on an existing tag.
    - name: Create Release
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}-build${{ github.run_number }}
        name: CatFlix v${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})
        body: |
          Automatic release of CatFlix v${{ steps.get_version.outputs.version }}.

          Assets included:
          - Debug APK
          - Release APK (signed with debug keys — sideload only, not for Play Store)
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
